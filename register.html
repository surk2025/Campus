<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusGuide - Create Account</title>
    <link rel="stylesheet" href="css\register.css">
    <script src="js/register.js" defer></script>
</head>

<body>

    <div class="register-container">

        <div class="left-section">

            <div class="logo">📍 CampusGuide</div>

            <h1>Create Your Campus Account</h1>

            <p>
                Join CampusGuide and easily explore classrooms,
                laboratories, departments, events and other
                important campus locations.
            </p>

        </div>

        <div class="right-section">

            <h2>Create Account</h2>

            <p class="subtitle">
                Fill in your details to get started
            </p>

            <form>

                <label>Full Name</label>
                <input type="text" id="Name" placeholder="Enter your full name">

                <label>Email Address</label>
                <input type="email" id="Email" placeholder="you@example.com">

                <label>Student ID</label>
                <input type="text" id="StdId" placeholder="Enter your student ID">

                <label>Department</label>
                <select>
                    <option>Select Department</option>
                    <option>Computer Science</option>
                    <option>Information Technology</option>
                    <option>Electronics</option>
                    <option>Mechanical</option>
                    <option>Civil</option>
                </select>

                <label>Password</label>
                <input type="password" id="Password" placeholder="Create a password">

                <div class="terms">
                    <input type="checkbox">
                    <span>I agree to the Terms and Conditions</span>
                </div>

                <button class="create-btn" type="submit">
                    Create Account
                </button>

            </form>

            <div class="login-link">
                Already have an account?
                <a href="login.html">Login</a>
            </div>

        </div>

    </div>

</body>
</html>
